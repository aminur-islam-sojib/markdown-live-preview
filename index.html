<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta http-equiv="content-language" content="en">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fast, privacy-first live markdown editor and previewer in the browser.">

    <script>
      (function(){
        try {
          var raw = localStorage.getItem('com.markdownlivepreview_theme');
          var useDark = raw === 'dark' || (!raw && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', useDark ? 'dark' : 'light');
          if (useDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Markdown Live Preview</title>
  </head>

  <body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 overflow-hidden m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
