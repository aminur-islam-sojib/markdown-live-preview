<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta http-equiv="content-language" content="en">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Markview: Fast, privacy-first live markdown editor and previewer in the browser with cloud sync and local library.">
    <meta property="og:title" content="Markview — Markdown Live Preview">
    <meta property="og:description" content="Fast, privacy-first live markdown editor and previewer in the browser.">
    <meta property="og:image" content="/image/markview-logo.jpg">
    <meta name="google-site-verification" content="googlea0c1f88bf958b462">

    <script>
      (function(){
        try {
          var raw = localStorage.getItem('com.markdownlivepreview_theme');
          var useDark = raw === 'dark' || (!raw && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', useDark ? 'dark' : 'light');
          if (useDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Tag Manager / GA4 -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-TLVWD394"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <link rel="icon" type="image/png" href="/image/markview.png">
    <title>Markview — Live Markdown Editor</title>
  </head>

  <body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 overflow-hidden m-0 p-0">
